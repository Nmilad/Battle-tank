<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tank Arena</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { height: 100%; background: #0B0E11; overflow: hidden; font-family: 'Courier New', monospace; touch-action: none; }
  body { display: flex; flex-direction: column; color: #C9D1D9; }

  #joinScreen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px; text-align: center; z-index: 20; background: #0B0E11;
  }
  #joinScreen.hidden { display: none; }
  #joinScreen .title { font-size: 26px; letter-spacing: 0.12em; text-transform: uppercase; color: #F2A93B; }
  #joinScreen input {
    font-family: inherit; background: #12171C; border: 1px solid #3A4552; color: #C9D1D9;
    padding: 12px 16px; font-size: 16px; letter-spacing: 0.15em; text-transform: uppercase;
    text-align: center; width: 220px;
  }
  #joinScreen button {
    font-family: inherit; background: transparent; border: 1px solid #F2A93B; color: #F2A93B;
    padding: 12px 26px; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase;
  }
  #joinScreen button:active { background: #F2A93B; color: #0B0E11; }
  #joinScreen .hint { font-size: 11px; color: #6B7684; line-height: 1.7; max-width: 280px; }
  #status { font-size: 12px; color: #6B7684; min-height: 16px; }

  #classGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 260px; }
  .classBtn {
    font-family: inherit; background: #12171C; border: 1px solid #2A323C; color: #C9D1D9;
    padding: 12px 8px; cursor: pointer; border-radius: 4px; position: relative;
  }
  .classBtn::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--c); opacity: 0.5; border-radius: 4px 4px 0 0;
  }
  .classBtn.selected { border-color: var(--c); background: #171D24; }
  .classBtn.selected::before { opacity: 1; }
  .className { font-size: 13px; font-weight: bold; color: var(--c); }
  .classRole { font-size: 10px; color: #6B7684; margin-top: 3px; }

  #hud { display: flex; justify-content: space-between; padding: 8px 10px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0; }
  .player-tag { display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; flex-shrink: 0; }
  .me .dot { background: #F2A93B; }
  .opp .dot { background: #3FD6C4; }
  .hp-bar { width: 70px; height: 5px; background: #1A2027; overflow: hidden; }
  .hp-fill { height: 100%; transition: width 0.1s linear; }
  .me .hp-fill { background: #F2A93B; }
  .opp .hp-fill { background: #3FD6C4; }

  #gameArea { position: relative; flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, #1B222A 0%, #0D1114 80%);
  }

  #controls { position: absolute; inset: 0; pointer-events: none; }
  #stick, #fireBtn, #jumpBtn, #abilityBtn { pointer-events: auto; }
  #stick { position: absolute; left: 22px; bottom: 22px; width: 110px; height: 110px; border: 1px solid #3A4552; border-radius: 50%; background: rgba(30,38,46,0.5); }
  #stickKnob { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; border-radius: 50%; background: #F2A93B; opacity: 0.85; }

  #fireBtn { position: absolute; right: 26px; bottom: 34px; width: 72px; height: 72px; border-radius: 50%; border: 1px solid #F2A93B; background: rgba(242,169,59,0.12); color: #F2A93B; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
  #fireBtn:active { background: rgba(242,169,59,0.35); }
  #jumpBtn { position: absolute; right: 108px; bottom: 96px; width: 56px; height: 56px; border-radius: 50%; border: 1px solid #8CF5E6; background: rgba(63,214,196,0.12); color: #8CF5E6; font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; }
  #jumpBtn:active { background: rgba(63,214,196,0.35); }
  #abilityBtn {
    position: absolute; right: 26px; bottom: 118px; width: 56px; height: 56px;
    border-radius: 50%; border: 1px solid #6FA8D6; background: rgba(111,168,214,0.12);
    color: #6FA8D6; font-size: 9px; letter-spacing: 0.05em; text-transform: uppercase; overflow: hidden;
  }
  #abilityBtn .cdOverlay { position: absolute; inset: 0; background: rgba(11,14,17,0.75); transform-origin: bottom; transform: scaleY(0); }
  #abilityBtn:disabled { opacity: 0.55; }

  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(11,14,17,0.92); gap: 16px; text-align: center; padding: 20px; pointer-events: auto; z-index: 10; }
  #overlay.show { display: flex; }
  #overlay .title { font-size: 24px; letter-spacing: 0.1em; text-transform: uppercase; }
  #overlay .sub { font-size: 12px; color: #6B7684; line-height: 1.6; }
  #overlay button { font-family: inherit; background: transparent; border: 1px solid #F2A93B; color: #F2A93B; padding: 12px 26px; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; }
</style>
</head>
<body>

<div id="joinScreen">
  <div class="title">Tank Arena</div>
  <div id="classGrid">
    <button class="classBtn" data-cls="typhoon" style="--c:#C9B458">
      <div class="className">تایفون</div><div class="classRole">سنگین / دفاع</div>
    </button>
    <button class="classBtn" data-cls="reaper" style="--c:#AEB7BE">
      <div class="className">ریپر</div><div class="classRole">سریع / هجومی</div>
    </button>
    <button class="classBtn" data-cls="guardian" style="--c:#5FA0D6">
      <div class="className">گاردین</div><div class="classRole">پشتیبان / ترمیم</div>
    </button>
    <button class="classBtn" data-cls="vanquisher" style="--c:#C25B4A">
      <div class="className">وانکویشر</div><div class="classRole">دوربرد</div>
    </button>
  </div>
  <input id="roomInput" maxlength="8" placeholder="کد اتاق" autocomplete="off" autocapitalize="characters">
  <button id="joinBtn">ورود به اتاق</button>
  <div class="hint">اول رباتت رو انتخاب کن، بعد یه کد دلخواه بنویس و همون کد رو به دوستت بده.</div>
  <div id="status"></div>
</div>

<div id="hud" style="display:none">
  <div class="player-tag me">
    <div class="dot"></div><span>شما</span>
    <div class="hp-bar"><div class="hp-fill" id="hpMe" style="width:100%"></div></div>
  </div>
  <div id="roundLabel" style="color:#4A5560; font-size:11px; align-self:center;">ROUND 1</div>
  <div class="player-tag opp">
    <div class="hp-bar"><div class="hp-fill" id="hpOpp" style="width:100%"></div></div>
    <span>حریف</span><div class="dot"></div>
  </div>
</div>

<div id="gameArea" style="display:none">
  <canvas id="game"></canvas>
  <div id="controls">
    <div id="stick"><div id="stickKnob"></div></div>
    <button id="jumpBtn">پرش</button>
    <button id="abilityBtn"><span>توانایی</span><div class="cdOverlay" id="abilityCd"></div></button>
    <button id="fireBtn">شلیک</button>
  </div>
  <div id="overlay">
    <div class="title" id="overlayTitle">در انتظار حریف...</div>
    <div class="sub" id="overlaySub"></div>
    <button id="restartBtn" style="display:none">دور بعد</button>
  </div>
</div>

<script>
if (window.Telegram && window.Telegram.WebApp) {
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
  if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  try { tg.setHeaderColor('#0B0E11'); } catch(e){}
  try { tg.setBackgroundColor('#0B0E11'); } catch(e){}
}

const joinScreen = document.getElementById('joinScreen');
const roomInput = document.getElementById('roomInput');
const joinBtn = document.getElementById('joinBtn');
const statusEl = document.getElementById('status');
const hud = document.getElementById('hud');
const gameArea = document.getElementById('gameArea');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlaySub = document.getElementById('overlaySub');
const restartBtn = document.getElementById('restartBtn');

const params = new URLSearchParams(location.search);
if (params.get('room')) roomInput.value = params.get('room');

let selectedClass = 'typhoon';
document.querySelectorAll('.classBtn').forEach(btn => {
  if (btn.dataset.cls === selectedClass) btn.classList.add('selected');
  btn.addEventListener('click', () => {
    document.querySelectorAll('.classBtn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedClass = btn.dataset.cls;
  });
});

let ws, mySlot, arena = {W:1000,H:500,GROUND_Y:440}, platforms = [], classDefs = {};
let latestState = null;

joinBtn.addEventListener('click', () => {
  const room = (roomInput.value || 'DEFAULT').trim().toUpperCase();
  if (!room) return;
  connect(room);
});

function connect(room) {
  statusEl.textContent = 'در حال اتصال...';
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}?room=${encodeURIComponent(room)}&cls=${encodeURIComponent(selectedClass)}`);

  ws.onopen = () => { statusEl.textContent = ''; };
  ws.onerror = () => { statusEl.textContent = 'خطا در اتصال به سرور.'; };
  ws.onclose = () => {
    if (joinScreen.classList.contains('hidden')) {
      overlayTitle.textContent = 'اتصال قطع شد';
      overlaySub.textContent = 'حریف یا سرور از دسترس خارج شد.';
      overlay.classList.add('show');
      restartBtn.style.display = 'none';
    } else {
      statusEl.textContent = 'اتصال قطع شد.';
    }
  };

  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'full') {
      statusEl.textContent = 'این اتاق پره. یه کد دیگه امتحان کن.';
      ws.close();
      return;
    }
    if (msg.type === 'welcome') {
      mySlot = msg.slot;
      arena = msg.arena;
      platforms = msg.platforms;
      classDefs = msg.classes || {};
      joinScreen.classList.add('hidden');
      hud.style.display = 'flex';
      gameArea.style.display = 'block';
      resize();
      startRender();
    }
    if (msg.type === 'state') {
      latestState = msg;
    }
  };
}

// ---------- rendering ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, scale, offX, offY;

function resize() {
  const areaW = gameArea.clientWidth, areaH = gameArea.clientHeight;
  canvas.width = areaW; canvas.height = areaH;
  scale = Math.min(areaW / arena.W, areaH / arena.H);
  offX = (areaW - arena.W * scale) / 2;
  offY = (areaH - arena.H * scale) / 2;
}
window.addEventListener('resize', resize);
function toScreen(x, y) { return [offX + x*scale, offY + y*scale]; }

// ---------- particles ----------
let particles = [];
function spawnBurst(x, y, color, count, opts = {}) {
  const { speed = 3, life = 30, size = 3 } = opts;
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI*2;
    const spd = speed * (0.4 + Math.random()*0.9);
    particles.push({ x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd - 1, life, maxLife: life, color, size: size * (0.6 + Math.random()*0.8) });
  }
}
function updateParticles() {
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.15;
    p.vx *= 0.95;
    p.life--;
    return p.life > 0;
  });
}
function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.maxLife;
    const [sx, sy] = toScreen(p.x, p.y);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(sx, sy, p.size * scale * a, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// ANIMATION SYSTEM
// A per-character state machine driving procedural pose values.
// Only IDLE and WALK are implemented this stage; the state enum
// and update() already have hook points for RUN/JUMP/FALL/LAND/
// SHOOT/HURT/ABILITY/DEATH so they can be added later without
// restructuring this controller.
//
// NOTE on limb movement: the current art is a single flat PNG per
// character (no separate body/arm/leg/weapon layers), so literal
// independent limb articulation isn't possible yet. What this
// controller does instead is a standard "whole-sprite procedural"
// approach: vertical bob, forward/back lean, horizontal sway, a
// subtle mechanical shear (gives a gait-like rocking impression),
// and squash/stretch — all driven by the robot's real measured
// speed, with smoothed (eased) transitions rather than instant
// switches. True independent arm/leg motion would need the art
// split into layered sprites later.
// ============================================================
const ANIM_STATE = Object.freeze({
  IDLE: 'idle', WALK: 'walk', RUN: 'run', JUMP: 'jump', FALL: 'fall',
  LAND: 'land', SHOOT: 'shoot', HURT: 'hurt', ABILITY: 'ability', DEATH: 'death',
});

class TankAnimator {
  constructor() {
    this.state = ANIM_STATE.IDLE;
    this.blend = 0;       // 0 = fully idle pose, 1 = fully walk pose (eased, not instant)
    this.phase = 0;       // walk-cycle clock
    this.idlePhase = 0;   // slower, independent idle-breathing clock
    this.speed = 0;       // smoothed horizontal speed (world units / ms)
    this._prevX = null;
  }

  // tank: latest server-authoritative tank state for this slot
  // dtMs: real elapsed time since last frame, in milliseconds
  update(tank, dtMs) {
    dtMs = Math.min(dtMs, 100); // guard against huge gaps (tab switch, lag spike)

    // --- measure real horizontal speed from position deltas, smoothed ---
    // (this is what makes accel/decel feel soft instead of snapping between poses)
    if (this._prevX !== null && dtMs > 0) {
      const instV = Math.abs(tank.x - this._prevX) / dtMs;
      const smoothing = 1 - Math.pow(0.001, dtMs / 140); // ~140ms time constant
      this.speed += (instV - this.speed) * smoothing;
    }
    this._prevX = tank.x;

    // --- state selection ---
    // Only IDLE/WALK are chosen for now. The other enum values are left
    // wired here as comments showing exactly where they'd plug in later,
    // without needing to touch gameplay/network code.
    const MOVE_EPS = 0.012; // world units/ms below which the robot reads as "stopped"
    let nextState = this.speed > MOVE_EPS ? ANIM_STATE.WALK : ANIM_STATE.IDLE;
    // Future hooks (not active this stage):
    //   !tank.grounded              -> ANIM_STATE.JUMP / ANIM_STATE.FALL
    //   just transitioned to ground -> ANIM_STATE.LAND
    //   external firing pulse       -> ANIM_STATE.SHOOT
    //   recent damage taken         -> ANIM_STATE.HURT
    //   ability just activated      -> ANIM_STATE.ABILITY
    //   !tank.alive                 -> ANIM_STATE.DEATH
    this.state = nextState;

    // --- smooth (eased) idle <-> walk blend, ~220ms ---
    const targetBlend = nextState === ANIM_STATE.WALK ? 1 : 0;
    const blendSmoothing = 1 - Math.pow(0.001, dtMs / 220);
    this.blend += (targetBlend - this.blend) * blendSmoothing;

    // --- advance animation clocks ---
    // stride rate scales with actual speed, so faster movement = faster cycle
    const strideRate = 0.010 + this.speed * 0.55;
    this.phase += dtMs * strideRate;
    this.idlePhase += dtMs * 0.0026;

    return this._pose();
  }

  _pose() {
    const b = this.blend;
    const walk = Math.sin(this.phase);
    const idle = Math.sin(this.idlePhase);

    return {
      state: this.state,
      blend: b,
      // vertical bob: gentle idle breathing eases into a stronger walk bounce
      bobY: idle * 1.1 * (1 - b) + Math.abs(walk) * 3.2 * b,
      // forward/back body lean while walking (weight shift per step)
      lean: walk * 0.055 * b,
      // horizontal micro-sway
      swayX: walk * 1.6 * b,
      // mechanical shear: rocks the upper body relative to the feet,
      // reading as a stylized gait without needing separate limb art
      skew: walk * 0.09 * b,
      // squash/stretch for a bit of mechanical "weight" per footfall
      squashY: 1 - Math.abs(walk) * 0.035 * b - Math.abs(idle) * 0.007 * (1 - b),
    };
  }
}

const animators = { 1: new TankAnimator(), 2: new TankAnimator() };
let lastFrameTs = null;

// expanding ring effect (shockwave / heal aura / target reticle)
let rings = [];
function spawnRing(x, y, color, opts = {}) {
  const { maxR = 70, life = 22, width = 3 } = opts;
  rings.push({ x, y, r: 4, maxR, life, maxLife: life, color, width });
}
function updateRings() {
  rings = rings.filter(rg => { rg.r += (rg.maxR - rg.r) * 0.25; rg.life--; return rg.life > 0; });
}
function drawRings() {
  for (const rg of rings) {
    const a = rg.life / rg.maxLife;
    const [sx, sy] = toScreen(rg.x, rg.y);
    ctx.save();
    ctx.globalAlpha = a * 0.8;
    ctx.strokeStyle = rg.color;
    ctx.lineWidth = rg.width * scale;
    ctx.beginPath();
    ctx.arc(sx, sy, rg.r * scale, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
}

function abilityEffect(cls, x, y) {
  if (cls === 'typhoon') {
    spawnRing(x, y, '#F2A93B', { maxR: 95, life: 20, width: 4 });
    spawnBurst(x, y - 8, '#C9B458', 16, { speed: 4, life: 22, size: 3 });
  } else if (cls === 'guardian') {
    spawnRing(x, y, '#4ADE80', { maxR: 80, life: 28, width: 3 });
    spawnBurst(x, y - 20, '#8CF5A8', 12, { speed: 1.6, life: 30, size: 2.5 });
  } else if (cls === 'vanquisher') {
    spawnRing(x, y, '#C25B4A', { maxR: 55, life: 24, width: 2 });
  } else if (cls === 'reaper') {
    spawnBurst(x, y - 20, '#AEB7BE', 10, { speed: 3, life: 16, size: 2 });
  }
}

function shadeColor(hex, amt) {
  const c = hex.replace('#','');
  const num = parseInt(c, 16);
  let r = (num >> 16) + amt, g = ((num >> 8) & 0xff) + amt, b = (num & 0xff) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return `rgb(${r},${g},${b})`;
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// ---------- sprite images ----------
const SPRITE_FILES = {
  typhoon: 'sprite_typhoon.png',
  reaper: 'sprite_reaper.png',
  guardian: 'sprite_guardian.png',
  vanquisher: 'sprite_vanquisher.png',
};
const spriteImages = {};
for (const [cls, file] of Object.entries(SPRITE_FILES)) {
  const img = new Image();
  img.src = file;
  spriteImages[cls] = img;
}

function drawGhost(t, color, alpha) {
  const img = spriteImages[t.cls];
  if (!img || !img.complete || !img.naturalWidth) return;
  const [sx, sy] = toScreen(t.x, t.y);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(sx, sy);
  ctx.scale(t.facing, 1);
  const targetH = 92 * scale;
  const targetW = targetH * (img.naturalWidth / img.naturalHeight);
  ctx.drawImage(img, -targetW/2, -targetH, targetW, targetH);
  ctx.restore();
}

function drawTank(t, color, fx = {}) {
  if (!t || !t.alive) return;
  const { recoilPx = 0, hitFlashActive = false, aimGlow = false, pose = {} } = fx;
  const { bobY = 0, lean = 0, swayX = 0, skew = 0, squashY = 1 } = pose;
  const [sx, sy] = toScreen(t.x, t.y);
  const img = spriteImages[t.cls];

  ctx.save();
  ctx.translate(sx - recoilPx * t.facing + swayX * scale, sy + bobY * scale);

  // ground shadow (stays put on the floor regardless of body sway/lean)
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(-swayX * scale, 2 - bobY * scale, 20*scale, 6*scale, 0, 0, Math.PI*2);
  ctx.fill();

  if (aimGlow) {
    const g = ctx.createRadialGradient(0,-46*scale,0, 0,-46*scale, 60*scale);
    g.addColorStop(0, 'rgba(194,91,74,0.35)');
    g.addColorStop(1, 'rgba(194,91,74,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -46*scale, 60*scale, 0, Math.PI*2); ctx.fill();
  }

  ctx.scale(t.facing, 1);
  ctx.rotate(lean);              // per-step weight-shift lean
  ctx.transform(1, 0, skew, 1, 0, 0); // mechanical gait shear (no separate limb art needed)
  ctx.scale(1, squashY);          // footfall squash/stretch

  if (img && img.complete && img.naturalWidth > 0) {
    const targetH = 92 * scale;
    const targetW = targetH * (img.naturalWidth / img.naturalHeight);
    ctx.drawImage(img, -targetW/2, -targetH, targetW, targetH);
    if (hitFlashActive) {
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = 'rgba(255,70,70,0.55)';
      ctx.fillRect(-targetW/2, -targetH, targetW, targetH);
      ctx.globalCompositeOperation = 'source-over';
    }
  } else {
    const w = 36*scale, h = 44*scale;
    ctx.fillStyle = shadeColor(color, -35);
    ctx.fillRect(-w*0.32, -h*0.32, w*0.22, h*0.32);
    ctx.fillRect(w*0.1, -h*0.32, w*0.22, h*0.32);
    const grad = ctx.createLinearGradient(0, -h, 0, -h*0.3);
    grad.addColorStop(0, shadeColor(color, 30));
    grad.addColorStop(1, shadeColor(color, -15));
    ctx.fillStyle = grad;
    roundRect(-w*0.42, -h, w*0.84, h*0.72, 3*scale);
    ctx.fill();
  }
  ctx.restore();
}

function drawMuzzleFlash(t, color) {
  if (!t || !t.alive) return;
  const [sx, sy] = toScreen(t.x, t.y);
  const fx = sx + t.facing * 40*scale;
  const fy = sy - 92*scale*0.55;
  const grad = ctx.createRadialGradient(fx,fy,0, fx,fy, 9*scale);
  grad.addColorStop(0, '#FFF3D6');
  grad.addColorStop(0.4, color);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.ellipse(fx, fy, 9*scale, 5*scale, 0, 0, Math.PI*2); ctx.fill();
}

function drawBullet(b) {
  const [sx, sy] = toScreen(b.x, b.y);
  const color = b.owner === mySlot ? '#F2A93B' : '#3FD6C4';
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, 7*scale);
  grad.addColorStop(0, '#FFFFFF');
  grad.addColorStop(0.3, color);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(sx, sy, 7*scale, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.arc(sx, sy, 2*scale, 0, Math.PI*2); ctx.fill();
}

function drawPlatforms() {
  for (const p of platforms) {
    if (p.x < 0 || p.x >= arena.W) continue;
    const [sx, sy] = toScreen(p.x, p.y);
    const ww = p.w*scale, wh = p.h*scale;
    const grad = ctx.createLinearGradient(sx, sy, sx, sy+wh);
    grad.addColorStop(0, '#33404B');
    grad.addColorStop(1, '#1B2229');
    ctx.fillStyle = grad;
    ctx.fillRect(sx, sy, ww, wh);
    ctx.strokeStyle = '#4A5A68';
    ctx.strokeRect(sx+0.5, sy+0.5, ww-1, Math.max(1,wh-1));
  }
}

function drawVignette() {
  const cx = canvas.width/2, cy = canvas.height/2;
  const r = Math.max(canvas.width, canvas.height) * 0.8;
  const grad = ctx.createRadialGradient(cx, cy, r*0.35, cx, cy, r);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function render(ts) {
  const dt = lastFrameTs === null ? 16 : Math.max(0, ts - lastFrameTs);
  lastFrameTs = ts;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawPlatforms();

  if (latestState) {
    const me = latestState.players[mySlot];
    const opp = latestState.players[mySlot === 1 ? 2 : 1];

    for (const [slot, tank] of [[mySlot, me], [mySlot === 1 ? 2 : 1, opp]]) {
      if (!tank) continue;
      const prevH = prevHp[slot];
      if (prevH !== null && tank.hp < prevH) {
        spawnBurst(tank.x, tank.y - 22, '#FFD27A', 10, { speed: 2.5, life: 18, size: 2.5 });
        hitFlash[slot] = 6;
      }
      if (prevAlive[slot] && !tank.alive) {
        spawnBurst(tank.x, tank.y - 22, '#FF7A45', 26, { speed: 4.5, life: 40, size: 4 });
      }
      prevHp[slot] = tank.hp;
      prevAlive[slot] = tank.alive;

      // ability-use edge detection -> trigger visual
      const prevCd = prevAbilityCd[slot];
      if (tank.abilityMax && prevCd <= 1 && tank.abilityCooldown >= tank.abilityMax - 2) {
        abilityEffect(tank.cls, tank.x, tank.y - 10);
      }
      prevAbilityCd[slot] = tank.abilityCooldown;

      // dash afterimages
      if (tank.dashing) {
        dashTrail[slot].push({ x: tank.x, y: tank.y, facing: tank.facing, cls: tank.cls });
        if (dashTrail[slot].length > 5) dashTrail[slot].shift();
      } else {
        dashTrail[slot] = [];
      }

      if (hitFlash[slot] > 0) hitFlash[slot]--;
      if (recoil[slot] > 0) recoil[slot] -= recoil[slot] * 0.3;
    }

    if (firing && me && me.alive) { drawMuzzleFlash(me, '#F2A93B'); recoil[mySlot] = 5*scale; }
    if (latestState.bullets.length > prevBulletCount && opp && opp.alive) {
      drawMuzzleFlash(opp, '#3FD6C4');
      recoil[mySlot === 1 ? 2 : 1] = 5*scale;
    }
    prevBulletCount = latestState.bullets.length;

    // dash afterimages (draw before bullets/tanks so tanks render on top)
    for (const slot of [1, 2]) {
      dashTrail[slot].forEach((g, i) => drawGhost(g, null, 0.08 + i*0.05));
    }

    latestState.bullets.forEach(drawBullet);

    for (const [slot, tank] of [[mySlot, me], [mySlot === 1 ? 2 : 1, opp]]) {
      if (!tank) continue;
      const pose = animators[slot].update(tank, dt);
      drawTank(tank, (classDefs[tank.cls] || {}).color, {
        pose, recoilPx: recoil[slot] || 0,
        hitFlashActive: hitFlash[slot] > 0,
        aimGlow: tank.aimBoost,
      });
    }

    document.getElementById('hpMe').style.width = (me ? Math.max(0, (me.hp/me.maxHp)*100) : 0) + '%';
    document.getElementById('hpOpp').style.width = (opp ? Math.max(0, (opp.hp/opp.maxHp)*100) : 0) + '%';
    document.getElementById('roundLabel').textContent = 'ROUND ' + latestState.round;

    if (me) {
      const cdFrac = me.abilityMax ? me.abilityCooldown / me.abilityMax : 0;
      abilityCd.style.transform = `scaleY(${cdFrac})`;
      abilityBtn.disabled = cdFrac > 0;
    }

    const oppConnected = latestState.connected[mySlot === 1 ? 2 : 1];
    if (!oppConnected) {
      overlayTitle.textContent = 'در انتظار حریف...';
      overlaySub.textContent = 'کد اتاق رو به دوستت بده تا وصل بشه.';
      overlay.classList.add('show');
      restartBtn.style.display = 'none';
    } else if (latestState.matchOver && latestState.winner) {
      overlayTitle.textContent = latestState.winner === mySlot ? 'بردی 🎉' : 'باختی 💥';
      overlaySub.textContent = '';
      overlay.classList.add('show');
      restartBtn.style.display = 'inline-block';
    } else {
      overlay.classList.remove('show');
    }
  }

  updateParticles();
  drawParticles();
  updateRings();
  drawRings();
  drawVignette();
  requestAnimationFrame(render);
}
let renderStarted = false;
function startRender() { if (!renderStarted) { renderStarted = true; requestAnimationFrame(render); } }

restartBtn.addEventListener('click', () => { ws.send(JSON.stringify({type:'restart'})); });

const stick = document.getElementById('stick');
const knob = document.getElementById('stickKnob');
let stickActive = false, stickX = 0;

function stickPos() { const r = stick.getBoundingClientRect(); return { x: r.left + r.width/2, y: r.top + r.height/2 }; }
function handleStickMove(clientX, clientY) {
  const c = stickPos();
  let dx = clientX - c.x, dy = clientY - c.y;
  const dist = Math.min(Math.hypot(dx, dy), 40);
  const ang = Math.atan2(dy, dx);
  dx = Math.cos(ang) * dist; dy = Math.sin(ang) * dist;
  knob.style.left = (35 + dx) + 'px'; knob.style.top = (35 + dy) + 'px';
  stickX = dx/40;
}
function resetStick() { stickActive = false; stickX = 0; knob.style.left = '35px'; knob.style.top = '35px'; }

stick.addEventListener('touchstart', e => { stickActive = true; handleStickMove(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); });
stick.addEventListener('touchmove', e => { if (stickActive) handleStickMove(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); });
stick.addEventListener('touchend', e => { resetStick(); e.preventDefault(); });
stick.addEventListener('mousedown', e => { stickActive = true; handleStickMove(e.clientX, e.clientY); });
window.addEventListener('mousemove', e => { if (stickActive) handleStickMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => resetStick());

let firing = false;
const fireBtn = document.getElementById('fireBtn');
fireBtn.addEventListener('touchstart', e => { firing = true; e.preventDefault(); });
fireBtn.addEventListener('touchend', e => { firing = false; e.preventDefault(); });
fireBtn.addEventListener('mousedown', () => firing = true);
fireBtn.addEventListener('mouseup', () => firing = false);

const jumpBtn = document.getElementById('jumpBtn');
function triggerJump(e) { e.preventDefault(); if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'jump' })); }
jumpBtn.addEventListener('touchstart', triggerJump);
jumpBtn.addEventListener('mousedown', triggerJump);

const abilityBtn = document.getElementById('abilityBtn');
const abilityCd = document.getElementById('abilityCd');
function triggerAbility(e) { e.preventDefault(); if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'ability' })); }
abilityBtn.addEventListener('touchstart', triggerAbility);
abilityBtn.addEventListener('mousedown', triggerAbility);

setInterval(() => {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'input', dx: stickX, firing }));
  }
}, 33);
</script>
</body>
